networks:
  dev-network:
    name: dev-network
    driver: bridge

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: dev-zookeeper
    restart: unless-stopped
    user: "${LOCAL_UID:?Run scripts/prepare-local-data.sh first}:0"
    volumes:
      - ./data/zookeeper/data:/var/lib/zookeeper/data
      - ./data/zookeeper/log:/var/lib/zookeeper/log
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - dev-network

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    container_name: dev-kafka
    restart: unless-stopped
    user: "${LOCAL_UID:?Run scripts/prepare-local-data.sh first}:0"
    depends_on:
      zookeeper:
        condition: service_started
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://dev-kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - dev-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: dev-kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=dev-kafka:29092
    depends_on:
      - kafka
    networks:
      - dev-network

  postgres:
    image: postgres:15
    container_name: dev-postgres
    restart: unless-stopped
    user: "${LOCAL_UID:?Run scripts/prepare-local-data.sh first}:0"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: dev_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - dev-network

  redis:
    image: redis:7
    container_name: dev-redis
    restart: unless-stopped
    user: "${LOCAL_UID:?Run scripts/prepare-local-data.sh first}:0"
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - dev-network

  prometheus:
    image: prom/prometheus
    container_name: dev-prometheus
    restart: unless-stopped
    user: "${LOCAL_UID:?Run scripts/prepare-local-data.sh first}:0"
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dev-network

  grafana:
    image: grafana/grafana
    container_name: dev-grafana
    restart: unless-stopped
    user: "${LOCAL_UID:?Run scripts/prepare-local-data.sh first}:0"
    ports:
      - "3000:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - dev-network
